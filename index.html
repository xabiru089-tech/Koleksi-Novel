<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HesTL - Koleksi Novel Terjemahan</title>
    <style>
        :root {
            --bg-body: #18181b;
            --bg-card: #27272a;
            --bg-modal: #27272a;
            --primary: #e4e4e7;
            --subtext: #a1a1aa;
            --accent: #3b82f6;
            --border: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            gap: 10px;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }

        button:active {
            opacity: 0.8;
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--primary);
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            background-color: var(--bg-card);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            color: var(--subtext);
            border: 1px solid var(--border);
        }

        .stats-bar span {
            color: #fff;
            font-weight: 600;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--primary);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #121214;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            line-height: 1.3;
        }

        .card-info {
            font-size: 0.8rem;
            color: var(--subtext);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-body {
            background-color: var(--bg-modal);
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--subtext);
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            line-height: 1.5;
        }

        .view-section {
            display: none;
        }

        .reader-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #e4e4e7;
            white-space: pre-wrap;
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-top: 16px;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--accent);
            margin-top: 8px;
        }

        .preview-img {
            max-width: 80px;
            max-height: 110px;
            margin-top: 8px;
            border-radius: 4px;
            display: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- UTAMA -->
    <div id="view-home">
        <header>
            <div class="brand">HesTL</div>
            <div class="btn-group">
                <button class="secondary" onclick="exportData()">Backup</button>
                <button class="secondary" onclick="document.getElementById('file-input').click()">Restore</button>
                <input type="file" id="file-input" style="display:none" onchange="importData(event)">
                <button onclick="openModal('modal-novel')">+ Novel</button>
            </div>
        </header>

        <div class="stats-bar">
            <div>Total Novel: <span id="stat-novels">0</span></div>
            <div>Total Bab: <span id="stat-chapters">0</span></div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Cari judul novel..." oninput="renderNovels()">
        </div>

        <div id="novel-list" class="grid"></div>
    </div>

    <!-- DETAIL NOVEL -->
    <div id="view-novel" class="view-section">
        <header>
            <button class="secondary" onclick="showView('view-home')">← Kembali</button>
            <div id="novel-detail-title" class="brand" style="font-size: 1.1rem;">Judul</div>
            <button onclick="openModal('modal-chapter')">+ Bab Baru</button>
        </header>

        <div id="chapter-list" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));"></div>
    </div>

    <!-- BACA BAB -->
    <div id="view-reader" class="view-section">
        <header>
            <button class="secondary" onclick="showView('view-novel')">← Bab</button>
            <div id="read-chapter-title" style="font-weight: 600;">Judul Bab</div>
            <div></div>
        </header>
        <div id="read-chapter-content" class="reader-content"></div>
    </div>

    <!-- MODAL NOVEL -->
    <div id="modal-novel" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-header">Tambah Novel Baru</div>
            <div class="form-group">
                <label>Judul Novel</label>
                <input type="text" id="input-novel-title" placeholder="Masukkan judul novel">
            </div>
            <div class="form-group">
                <label>Gambar Sampul (File / Galeri)</label>
                <input type="file" id="input-novel-cover" accept="image/*" onchange="previewCover(event)">
                <img id="cover-preview" class="preview-img" alt="Sampul">
            </div>
            <div class="btn-group" style="justify-content: flex-end; margin-top: 16px;">
                <button class="secondary" onclick="closeModal('modal-novel')">Batal</button>
                <button onclick="saveNovel()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL BAB -->
    <div id="modal-chapter" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-header">Tambah Bab Baru</div>
            <div class="form-group">
                <label>Judul Bab</label>
                <input type="text" id="input-chapter-title" placeholder="Contoh: Bab 1">
            </div>
            <div class="form-group">
                <label>Tempel Teks Mandarin Di Sini</label>
                <textarea id="raw-chinese-text" placeholder="Tempelkan teks di sini. Pemisah paragraf akan ditambahkan secara otomatis."></textarea>
            </div>
            <button type="button" id="btn-process" style="width: 100%; padding: 10px;" onclick="processAndSaveChapter()">
                Format & Simpan Bab
            </button>
            <div id="status-msg" class="status-text"></div>
            <div class="btn-group" style="justify-content: flex-end; margin-top: 16px;">
                <button class="secondary" onclick="closeModal('modal-chapter')">Batal</button>
            </div>
        </div>
    </div>

    <script>
        let db = [];
        let activeNovelId = null;
        let selectedCoverBase64 = "";

        // Inisialisasi awal saat halaman dimuat
        window.addEventListener('DOMContentLoaded', function() {
            try {
                const data = localStorage.getItem('hestl_novels_db');
                if (data) {
                    db = JSON.parse(data);
                }
            } catch (e) {
                db = [];
            }
            updateStats();
            renderNovels();
        });

        function saveData() {
            localStorage.setItem('hestl_novels_db', JSON.stringify(db));
            updateStats();
            renderNovels();
        }

        function updateStats() {
            document.getElementById('stat-novels').innerText = db.length;
            let total = 0;
            for (let i = 0; i < db.length; i++) {
                if (db[i].chapters) total += db[i].chapters.length;
            }
            document.getElementById('stat-chapters').innerText = total;
        }

        function showView(viewId) {
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-novel').style.display = 'none';
            document.getElementById('view-reader').style.display = 'none';
            document.getElementById(viewId).style.display = 'block';
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            document.getElementById('status-msg').innerText = '';
        }

        function previewCover(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedCoverBase64 = e.target.result;
                    const img = document.getElementById('cover-preview');
                    img.src = selectedCoverBase64;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // Pemisah Paragraf Otomatis
        function autoFormatParagraphs(text) {
            if (!text) return "";
            let formatted = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            formatted = formatted.replace(/([。！？\?!])([^\n"'])/g, '$1\n\n$2');
            let lines = formatted.split('\n');
            let cleanLines = [];
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim().length > 0) {
                    cleanLines.push(lines[i].trim());
                }
            }
            return cleanLines.join('\n\n');
        }

        // Fungsi Terjemahan dengan fallback
        async function translateText(text) {
            const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=id&dt=t&q=" + encodeURIComponent(text);
            try {
                const res = await fetch(url);
                if (!res.ok) return text;
                const data = await res.json();
                let output = "";
                if (data && data[0]) {
                    for (let i = 0; i < data[0].length; i++) {
                        if (data[0][i][0]) output += data[0][i][0];
                    }
                }
                return output || text;
            } catch (e) {
                return text; // Jika koneksi gagal, tampilkan teks yang sudah di-format
            }
        }

        async function processAndSaveChapter() {
            const titleInput = document.getElementById('input-chapter-title');
            const textInput = document.getElementById('raw-chinese-text');
            const statusEl = document.getElementById('status-msg');
            const btn = document.getElementById('btn-process');

            const title = titleInput.value.trim();
            let rawText = textInput.value.trim();

            if (!title || !rawText) {
                alert('Judul dan Teks Wajib Diisi!');
                return;
            }

            btn.disabled = true;
            statusEl.innerText = "⏳ Memproses dan memisah paragraf...";

            // 1. Format Jarak Paragraf
            rawText = autoFormatParagraphs(rawText);

            // 2. Terjemahkan
            const paragraphs = rawText.split('\n\n');
            let translatedArray = [];

            for (let i = 0; i < paragraphs.length; i++) {
                statusEl.innerText = "⏳ Menerjemahkan paragraf " + (i + 1) + " dari " + paragraphs.length + "...";
                let t = await translateText(paragraphs[i]);
                translatedArray.push(t);
            }

            const finalContent = translatedArray.join('\n\n');

            // 3. Simpan ke Database
            for (let i = 0; i < db.length; i++) {
                if (db[i].id === activeNovelId) {
                    if (!db[i].chapters) db[i].chapters = [];
                    db[i].chapters.push({
                        id: Date.now(),
                        title: title,
                        content: finalContent,
                        rawChinese: rawText
                    });
                    break;
                }
            }

            saveData();
            renderChapters();

            titleInput.value = "";
            textInput.value = "";
            btn.disabled = false;
            closeModal('modal-chapter');
            alert('✅ Bab Berhasil Disimpan!');
        }

        function saveNovel() {
            const titleInput = document.getElementById('input-novel-title');
            const title = titleInput.value.trim();

            if (!title) {
                alert('Judul Novel Tidak Boleh Kosong!');
                return;
            }

            db.push({
                id: Date.now(),
                title: title,
                cover: selectedCoverBase64,
                chapters: []
            });

            titleInput.value = "";
            document.getElementById('input-novel-cover').value = "";
            document.getElementById('cover-preview').style.display = "none";
            selectedCoverBase64 = "";

            closeModal('modal-novel');
            saveData();
        }

        function renderNovels() {
            const container = document.getElementById('novel-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = "";

            let count = 0;
            for (let i = 0; i < db.length; i++) {
                if (db[i].title.toLowerCase().indexOf(searchVal) !== -1) {
                    count++;
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const novelId = db[i].id;
                    card.onclick = function() { openNovel(novelId); };

                    const defaultImg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="%2327272a"><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23a1a1aa" font-size="12">Tanpa Sampul</text></svg>';
                    const coverSrc = db[i].cover ? db[i].cover : defaultImg;
                    const chapCount = db[i].chapters ? db[i].chapters.length : 0;

                    card.innerHTML = 
                        '<img src="' + coverSrc + '" class="card-cover" alt="Cover">' +
                        '<div class="card-body">' +
                            '<div class="card-title">' + db[i].title + '</div>' +
                            '<div class="card-info">' + chapCount + ' Bab</div>' +
                        '</div>';

                    container.appendChild(card);
                }
            }

            if (count === 0) {
                container.innerHTML = '<div style="color:var(--subtext); grid-column: 1/-1;">Belum ada novel.</div>';
            }
        }

        function openNovel(id) {
            activeNovelId = id;
            let novel = null;
            for (let i = 0; i < db.length; i++) {
                if (db[i].id === id) {
                    novel = db[i];
                    break;
                }
            }
            if (novel) {
                document.getElementById('novel-detail-title').innerText = novel.title;
                renderChapters();
                showView('view-novel');
            }
        }

        function renderChapters() {
            const container = document.getElementById('chapter-list');
            container.innerHTML = "";

            let novel = null;
            for (let i = 0; i < db.length; i++) {
                if (db[i].id === activeNovelId) {
                    novel = db[i];
                    break;
                }
            }

            if (!novel || !novel.chapters || novel.chapters.length === 0) {
                container.innerHTML = '<div style="color:var(--subtext); grid-column: 1/-1;">Belum ada bab.</div>';
                return;
            }

            for (let i = 0; i < novel.chapters.length; i++) {
                const chap = novel.chapters[i];
                const card = document.createElement('div');
                card.className = 'card';
                card.style.padding = '12px';
                
                const chapId = chap.id;
                card.onclick = function() { readChapter(chapId); };

                card.innerHTML = '<div class="card-title">' + chap.title + '</div>';
                container.appendChild(card);
            }
        }

        function readChapter(chapId) {
            let novel = null;
            for (let i = 0; i < db.length; i++) {
                if (db[i].id === activeNovelId) {
                    novel = db[i];
                    break;
                }
            }

            if (!novel) return;

            let chap = null;
            for (let i = 0; i < novel.chapters.length; i++) {
                if (novel.chapters[i].id === chapId) {
                    chap = n
