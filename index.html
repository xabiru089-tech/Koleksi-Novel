<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HesTL - Perpustakaan Novel Pribadi</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-modal: #252525;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #333333;
            --font-size-reader: 1.1rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        button.secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-sub);
        }

        button.danger {
            background-color: #dc2626;
        }
        button.danger:hover {
            background-color: #b91c1c;
        }

        main {
            padding: 20px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            background-color: var(--bg-card);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            border: 1px solid var(--border);
        }

        .stats-bar span {
            color: #fff;
            font-weight: 600;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s, border-color 0.15s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card-cover {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #121212;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            line-height: 1.3;
        }

        .card-author {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .card-info {
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: auto;
            padding-top: 6px;
        }

        /* DETAIL NOVEL */
        .novel-header {
            display: flex;
            gap: 20px;
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .novel-detail-cover {
            width: 130px;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #121212;
        }

        .novel-detail-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chapter-item {
            background-color: var(--bg-card);
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .chapter-item:hover {
            border-color: var(--accent);
        }

        /* READER MODE */
        .reader-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .reader-box {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
            line-height: 1.9;
            font-size: var(--font-size-reader);
            white-space: pre-wrap;
        }

        .reader-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-body {
            background-color: var(--bg-modal);
            width: 100%;
            max-width: 550px;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        input[type="text"], textarea, select {
            width: 100%;
            background-color: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        .view-section {
            display: none;
        }

        /* THEME READER OPTIONS */
        .theme-dark { background-color: #18181b; color: #e4e4e7; }
        .theme-light { background-color: #f4f4f5; color: #18181b; }
        .theme-sepia { background-color: #fbf0d9; color: #5f4b32; }

        .preview-img {
            max-width: 80px;
            max-height: 110px;
            margin-top: 8px;
            border-radius: 4px;
            display: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="showView('view-home')">📚 HesTL Manager</div>
        <div class="btn-group">
            <button class="secondary" onclick="exportData()">Backup (.json)</button>
            <button class="secondary" onclick="document.getElementById('file-input').click()">Restore</button>
            <input type="file" id="file-input" style="display:none" onchange="importData(event)">
            <button onclick="openModal('modal-novel')">+ Novel Baru</button>
        </div>
    </header>

    <main>
        <!-- TAMPILAN BERANDA -->
        <div id="view-home">
            <div class="stats-bar">
                <div>Total Novel: <span id="stat-novels">0</span></div>
                <div>Total Bab: <span id="stat-chapters">0</span></div>
            </div>

            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Cari judul novel..." oninput="renderNovels()">
            </div>

            <div id="novel-list" class="grid"></div>
        </div>

        <!-- TAMPILAN DETAIL NOVEL -->
        <div id="view-novel" class="view-section">
            <button class="secondary" style="margin-bottom: 16px;" onclick="showView('view-home')">← Kembali ke Koleksi</button>
            
            <div class="novel-header">
                <img id="detail-cover" class="novel-detail-cover" src="" alt="Cover">
                <div class="novel-detail-info">
                    <h2 id="detail-title" style="color: #fff;">Judul Novel</h2>
                    <div id="detail-author" style="color: var(--text-sub); font-size: 0.9rem;">Penulis: -</div>
                    <p id="detail-desc" style="font-size: 0.85rem; color: var(--text-sub); flex-grow: 1;">Deskripsi novel...</p>
                    <div class="btn-group" style="margin-top: 10px;">
                        <button onclick="openModal('modal-chapter')">+ Tambah Bab</button>
                        <button class="danger" onclick="deleteActiveNovel()">Hapus Novel</button>
                    </div>
                </div>
            </div>

            <h3 style="margin-bottom: 12px; color: #fff;">Daftar Bab</h3>
            <div id="chapter-list" class="chapter-list"></div>
        </div>

        <!-- TAMPILAN BACA BAB -->
        <div id="view-reader" class="view-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <button class="secondary" onclick="showView('view-novel')">← Daftar Bab</button>
                <button class="danger" onclick="deleteActiveChapter()">Hapus Bab Ini</button>
            </div>

            <div class="reader-controls">
                <div>
                    <label style="display:inline; margin-right: 6px;">Ukuran Teks:</label>
                    <select onchange="changeFontSize(this.value)" style="width: auto; padding: 4px 8px;">
                        <option value="0.95rem">Kecil</option>
                        <option value="1.1rem" selected>Normal</option>
                        <option value="1.25rem">Besar</option>
                        <option value="1.4rem">Sangat Besar</option>
                    </select>
                </div>
                <div>
                    <label style="display:inline; margin-right: 6px;">Tema:</label>
                    <select onchange="changeTheme(this.value)" style="width: auto; padding: 4px 8px;">
                        <option value="theme-dark" selected>Gelap</option>
                        <option value="theme-light">Terang</option>
                        <option value="theme-sepia">Sepia</option>
                    </select>
                </div>
            </div>

            <h2 id="read-chapter-title" style="margin-bottom: 16px; color: #fff; text-align: center;">Judul Bab</h2>
            
            <div id="reader-box" class="reader-box theme-dark"></div>

            <div class="reader-nav">
                <button id="btn-prev-chap" class="secondary" onclick="navChapter(-1)">← Bab Sebelumnya</button>
                <button id="btn-next-chap" class="secondary" onclick="navChapter(1)">Bab Selanjutnya →</button>
            </div>
        </div>
    </main>

    <!-- MODAL TAMBAH NOVEL -->
    <div id="modal-novel" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-header">Tambah Novel Baru</div>
            <div class="form-group">
                <label>Judul Novel *</label>
                <input type="text" id="input-novel-title" placeholder="Contoh: Overgeared / 全职高手">
            </div>
            <div class="form-group">
                <label>Penulis</label>
                <input type="text" id="input-novel-author" placeholder="Nama penulis">
            </div>
            <div class="form-group">
                <label>Deskripsi / Sinopsis</label>
                <textarea id="input-novel-desc" style="min-height: 80px;" placeholder="Ringkasan cerita novel..."></textarea>
            </div>
            <div class="form-group">
                <label>Gambar Sampul (Galeri / File)</label>
                <input type="file" id="input-novel-cover" accept="image/*" onchange="previewCover(event)">
                <img id="cover-preview" class="preview-img" alt="Sampul">
            </div>
            <div class="btn-group" style="justify-content: flex-end; margin-top: 16px;">
                <button class="secondary" onclick="closeModal('modal-novel')">Batal</button>
                <button onclick="saveNovel()">Simpan Novel</button>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH BAB -->
    <div id="modal-chapter" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-header">Tambah Bab Baru</div>
            <div class="form-group">
                <label>Judul / Nomor Bab *</label>
                <input type="text" id="input-chapter-title" placeholder="Contoh: Bab 10 - Kebangkitan">
            </div>
            <div class="form-group">
                <label>Isi Teks Terjemahan *</label>
                <textarea id="input-chapter-text" placeholder="Tempelkan isi novel yang sudah kamu terjemahkan di sini..."></textarea>
            </div>
            <div style="margin-bottom: 14px;">
                <button type="button" class="secondary" style="width: 100%;" onclick="formatTextParagraphs()">
                    ✨ Rapikan & Beri Jarak Paragraf Otomatis
                </button>
            </div>
            <div class="btn-group" style="justify-content: flex-end; margin-top: 16px;">
                <button class="secondary" onclick="closeModal('modal-chapter')">Batal</button>
                <button onclick="saveChapter()">Simpan Bab</button>
            </div>
        </div>
    </div>

    <script>
        let db = [];
        let activeNovelId = null;
        let activeChapterId = null;
        let selectedCoverBase64 = "";

        // Load data saat pertama kali buka
        window.addEventListener('DOMContentLoaded', function() {
            try {
                const data = localStorage.getItem('hestl_novels_library');
                if (data) db = JSON.parse(data);
            } catch (e) {
                db = [];
            }
            updateStats();
            renderNovels();
        });

        function saveData() {
            localStorage.setItem('hestl_novels_library', JSON.stringify(db));
            updateStats();
            renderNovels();
        }

        function updateStats() {
            document.getElementById('stat-novels').innerText = db.length;
            let total = 0;
            for (let i = 0; i < db.length; i++) {
                if (db[i].chapters) total += db[i].chapters.length;
            }
            document.getElementById('stat-chapters').innerText = total;
        }

        function showView(viewId) {
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-novel').style.display = 'none';
            document.getElementById('view-reader').style.display = 'none';
            document.getElementById(viewId).style.display = 'block';
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function previewCover(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedCoverBase64 = e.target.result;
                    const img = document.getElementById('cover-preview');
                    img.src = selectedCoverBase64;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // Fitur Pemisah Paragraf Otomatis
        function formatTextParagraphs() {
            const txtArea = document.getElementById('input-chapter-text');
            let text = txtArea.value;
            if (!text) return;

            // Beri baris baru pada titik/tanda tanya/seru jika dempet
            let formatted = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            formatted = formatted.replace(/([。！？\?!])([^\n"'])/g, '$1\n\n$2');
            
            let lines = formatted.split('\n');
            let cleanLines = [];
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim().length > 0) {
                    cleanLines.push(lines[i].trim());
                }
            }
            txtArea.value = cleanLines.join('\n\n');
        }

        function saveNovel() {
            const title = document.getElementById('input-novel-title').value.trim();
            const author = document.getElementById('input-novel-author').value.trim();
            const desc = document.getElementById('input-novel-desc').value.trim();

            if (!title) {
                alert('Judul Novel wajib diisi!');
                return;
            }

            db.push({
                id: Date.now(),
                title: title,
                author: author || 'Anonim',
                desc: desc || 'Belum ada deskripsi.',
                cover: selectedCoverBase64,
                chapters: []
            });

            document.getElementById('input-novel-title').value = '';
            document.getElementById('input-novel-author').value = '';
            document.getElementById('input-novel-desc').value = '';
            document.getElementById('input-novel-cover').value = '';
            document.getElementById('cover-preview').style.display = 'none';
            selectedCoverBase64 = "";

            closeModal('modal-novel');
            saveData();
        }

        function renderNovels() {
            const container = document.getElementById('novel-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = "";

            let count = 0;
            for (let i = 0;
